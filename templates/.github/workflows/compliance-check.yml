name: Compliance citation check
on:
  pull_request:
    branches: [main, master]

jobs:
  citations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install mcp-custos
        run: bun add -g mcp-custos

      - name: Verify compliance citations on changed files
        env:
          COMPLIANCE_BASE: origin/${{ github.base_ref }}
        run: custos-check-citations --strict
